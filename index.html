<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roleta Gacha Animada - Poki Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #090a10;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4vw;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      transition: all 0.5s ease;
    }
    .wheel-box {
      position: relative;
      width: min(55vw, 82vh);
      height: min(55vw, 82vh);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.5s ease;
    }
    canvas {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(255, 71, 87, 0.3));
      transition: filter 0.5s ease;
    }
    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #ff4757;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #141726;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a2f4c;
      width: min(38vw, 280px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
    }
    h2 {
      color: #ffd32a;
      font-size: 1rem;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 1px;
    }
    .result-box {
      background: #090a10;
      border: 2px solid #ff4757;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      width: 100%;
      transition: border-color 0.4s ease;
    }
    .race-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }
    .race-chance {
      font-size: 0.75rem;
      color: #a4b0be;
      margin-top: 3px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
